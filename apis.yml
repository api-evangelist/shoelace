x-contract-discovery:
  checked: '2026-08-12'
  result: no published contract found
  note: >-
    STEP 0b/0c contract discovery ran against shoelace.com and every candidate
    subdomain. Two findings are recorded here so a later pass does not re-litigate
    them and does not wrongly save them.
  rejected:
  - url: https://shoelace.com/api/openapi.json
    status: 200
    parses_as: OpenAPI 3.1.0
    verdict: rejected-not-this-company
    why: >-
      Real, parseable OpenAPI served from Shoelace's own domain — and it is NOT
      Shoelace's. info.title is "Base44 App Management API", servers[] is
      https://app.base44.com, and the two operations are
      GET /api/apps/{app_id}/coding/export-to-zip and POST /api/apps/{app_id}/deploy
      with a "Personal API key" apiKey scheme. shoelace.com is built and hosted on
      Base44, which serves this platform-management spec from every app domain. It
      describes Base44's product, not Shoelace's, so nothing is derived from it.
  - url: https://shoelace.com/.well-known/openid-configuration
    status: 200
    verdict: rejected-not-this-company
    why: >-
      Declares issuer https://app.base44.com with Base44 platform scopes; the same
      shared document is served from every Base44-hosted domain. See
      well-known/shoelace-well-known.yml.
  misses:
  - {url: 'https://api.shoelace.com', status: 000, note: DNS does not resolve}
  - {url: 'https://docs.shoelace.com', status: 000, note: DNS does not resolve}
  - {url: 'https://developer.shoelace.com', status: 000, note: DNS does not resolve}
  - {url: 'https://status.shoelace.com', status: 000, note: DNS does not resolve}
  - {url: 'https://trust.shoelace.com', status: 000, note: DNS does not resolve}
  - {url: 'https://go.shoelace.com/', status: 404, note: retired HubSpot landing-page host}
  - {url: 'https://shoelace.com/.well-known/agent-card.json', status: 404}
  - {url: 'https://shoelace.com/.well-known/agent.json', status: 404}
  soft_200_hosts:
  - host: shoelace.com
    note: >-
      Client-rendered single-page app on Base44. Every unknown HTML path returns
      HTTP 200 with the same ~22KB shell and a <title> that echoes the URL slug, so
      an HTML 200 is not evidence a page exists. /pricing, /help, /terms-of-service,
      /privacy-policy, /security and /changelog were all confirmed soft-200s this
      pass and their previously-recorded pointers were removed. The auto-generated
      BreadcrumbList JSON-LD also echoes the slug back into the page, which is how
      the shared security-programs probe produced a false "responsible disclosure"
      hit on https://shoelace.com/security/responsible-disclosure — that artifact and
      its pointer were removed rather than published.
