aid: shoelace
name: Shoelace
description: Shoelace is an omni-channel growth marketing agency for direct-to-consumer
  (DTC) and e-commerce brands, founded in 2015 and trusted by 300+ brands. The team
  plans, creates, and optimizes paid acquisition across Meta, Google, TikTok and YouTube
  alongside email and SMS retention, performance creative, UGC, and in-house photo and
  video production. Shoelace operates as a managed growth partner delivering marketing
  services — it sells campaign management, not software, and publishes no developer
  API, SDK, webhook surface, or developer portal. This API Evangelist profile tracks
  the company as a 500 Global portfolio lead and captures its public web presence,
  its published llms.txt, and its domain-security posture.
